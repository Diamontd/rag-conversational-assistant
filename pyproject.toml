[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-conversational-assistant"
version = "1.0.0"
description = "Production Multi-Turn RAG Assistant, Evals & Retrieval Benchmark Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "google-genai>=0.1.0",
    "qdrant-client>=1.10.0",
    "langfuse>=2.50.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dist", "build"]

